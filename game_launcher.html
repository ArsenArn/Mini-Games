<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Launcher</title>
  <style>
    :root{
      --bg-top:#eef4ff;
      --bg-bottom:#f7f0e7;
      --panel:rgba(255,255,255,.78);
      --panel-border:rgba(20,48,84,.08);
      --text:#143054;
      --muted:#5f7391;
      --accent:#173b67;
      --accent-soft:#e7eef9;
      --shadow:0 24px 60px rgba(20,48,84,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--text)}
    body{
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at top left, rgba(90,135,255,.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(245,201,77,.18), transparent 28%),
        linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    }
    .shell{
      width:min(100%,1100px);
      padding:20px;
      border-radius:32px;
      background:var(--panel);
      border:1px solid var(--panel-border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }
    .hero{
      display:grid;
      gap:10px;
      margin-bottom:20px;
    }
    .eyebrow{
      font-size:12px;
      letter-spacing:.26em;
      text-transform:uppercase;
      color:var(--muted);
    }
    h1{
      margin:0;
      font-size:clamp(36px,7vw,68px);
      line-height:.92;
      max-width:700px;
    }
    .sub{
      margin:0;
      max-width:720px;
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:16px;
    }
    .card{
      display:grid;
      gap:14px;
      padding:18px;
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(239,244,255,.88));
      border:1px solid rgba(20,48,84,.08);
      box-shadow:0 14px 34px rgba(20,48,84,.08);
    }
    .preview{
      position:relative;
      height:170px;
      overflow:hidden;
      border-radius:18px;
      background:linear-gradient(180deg,#edf5ff,#f8fbff);
      border:1px solid rgba(20,48,84,.06);
    }
    .preview.snake{
      background:
        linear-gradient(180deg,rgba(90,135,255,.16) 0 48%, rgba(23,59,103,.9) 48% 53%, rgba(78,203,144,.08) 53% 100%),
        linear-gradient(90deg,rgba(20,48,84,.08) 0 1px,transparent 1px),
        linear-gradient(180deg,rgba(20,48,84,.08) 0 1px,transparent 1px);
      background-size:100% 100%, 28px 28px, 28px 28px;
    }
    .preview.plush{
      background:
        radial-gradient(circle at 28% 36%, rgba(255,108,121,.34), transparent 16%),
        radial-gradient(circle at 64% 48%, rgba(245,201,77,.32), transparent 18%),
        radial-gradient(circle at 72% 26%, rgba(90,135,255,.28), transparent 14%),
        linear-gradient(180deg,#fff8f0,#f4f8ff);
    }
    .preview.worm{
      background:
        radial-gradient(circle at 24% 24%, rgba(255,197,106,.28), transparent 22%),
        radial-gradient(circle at 78% 74%, rgba(90,135,255,.18), transparent 24%),
        linear-gradient(180deg,#fff9ef,#eef7ff);
    }
    .preview.fortress{
      background:
        radial-gradient(circle at 22% 22%, rgba(255,186,94,.28), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(111,188,255,.18), transparent 24%),
        linear-gradient(180deg,rgba(193,228,255,.95) 0 48%, rgba(253,244,215,.96) 48% 100%);
    }
    .wall{
      position:absolute;
      left:14px;
      right:14px;
      top:78px;
      height:18px;
      border-radius:999px;
      background:#173b67;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.28);
    }
    .orb,.enemy,.snakeSeg{
      position:absolute;
      border-radius:50%;
    }
    .orb.blue,.enemy.blue{background:#5a87ff}
    .orb.red,.enemy.red{background:#ff6c79}
    .orb.yellow,.enemy.yellow{background:#f5c94d}
    .orb.green,.enemy.green{background:#4ecb90}
    .enemy{
      width:22px;
      height:22px;
      border-radius:8px;
      box-shadow:0 8px 16px rgba(20,48,84,.12);
    }
    .orb{
      width:20px;
      height:20px;
      box-shadow:0 8px 16px rgba(20,48,84,.12);
    }
    .snakeSeg{
      width:22px;
      height:22px;
      box-shadow:0 8px 16px rgba(20,48,84,.12);
    }
    .snakeEnd{
      background:#173b67;
      border-radius:14px 50% 50% 14px;
    }
    .line{
      position:absolute;
      height:12px;
      border-radius:999px;
      background:#173b67;
    }
    .plushDot{
      position:absolute;
      width:40px;
      height:40px;
      border-radius:14px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(20,48,84,.08);
      box-shadow:0 12px 24px rgba(20,48,84,.08);
    }
    .plushDot::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:999px;
      background:linear-gradient(180deg,#ffd7dc,#fff4f6);
    }
    .pipeGhost{
      position:absolute;
      border-radius:999px;
      background:rgba(36,77,130,.12);
      border:1px dashed rgba(36,77,130,.16);
    }
    .socket{
      position:absolute;
      width:28px;
      height:28px;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      border:5px solid rgba(214,224,236,.92);
      box-shadow:0 10px 22px rgba(24,49,79,.08);
    }
    .wormLink{
      position:absolute;
      height:16px;
      border-radius:999px;
      background:#f5c94d;
      box-shadow:0 10px 20px rgba(245,201,77,.22);
      transform-origin:left center;
    }
    .wormSeg{
      position:absolute;
      width:24px;
      height:24px;
      border-radius:50%;
      box-shadow:0 10px 20px rgba(24,49,79,.1);
    }
    .wormSeg.yellow{background:#f5c94d}
    .wormSeg.blue{background:#5a87ff}
    .wormSeg.red{background:#ff6c79}
    .wormSeg.green{background:#4ecb90}
    .fortressTile,.fortressUnit,.fortressBolt,.fortressSegment,.fortressBadge{
      position:absolute;
    }
    .fortressTile{
      width:26px;
      height:26px;
      border-radius:10px;
      border:1px solid rgba(20,48,84,.08);
      background:rgba(255,255,255,.38);
    }
    .fortressSegment{
      height:24px;
      border-radius:999px;
      background:linear-gradient(180deg,#ffe8bd,#f3aa61);
      box-shadow:0 10px 18px rgba(24,49,79,.1);
    }
    .fortressBadge{
      width:22px;
      height:22px;
      border-radius:10px;
      display:grid;
      place-items:center;
      font-size:13px;
      background:rgba(255,255,255,.72);
      box-shadow:0 8px 14px rgba(24,49,79,.08);
    }
    .fortressUnit{
      width:18px;
      height:18px;
      border-radius:50%;
      box-shadow:0 8px 14px rgba(24,49,79,.12);
    }
    .fortressUnit.player{background:#f3aa61}
    .fortressUnit.enemy{background:#7f4a5b}
    .fortressBolt{
      width:34px;
      height:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#ffe4a4,#f3aa61);
      transform:rotate(-18deg);
      box-shadow:0 8px 12px rgba(243,170,97,.22);
    }
    .titleRow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .tag{
      padding:8px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .card h2{
      margin:0;
      font-size:28px;
      line-height:1;
    }
    .desc{
      margin:0;
      color:var(--muted);
      line-height:1.5;
      font-size:15px;
      min-height:66px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .launchBtn{
      flex:1 1 150px;
      border:0;
      border-radius:16px;
      padding:14px 16px;
      background:var(--accent);
      color:#fff;
      font:inherit;
      font-weight:700;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      box-shadow:0 14px 28px rgba(23,59,103,.2);
    }
    .launchBtn.secondary{
      background:#fff;
      color:var(--accent);
      border:1px solid rgba(20,48,84,.1);
      box-shadow:none;
    }
    .launchBtn:hover{transform:translateY(-1px)}
    .launchBtn:active{transform:translateY(1px) scale(.99)}
    .footer{
      margin-top:18px;
      color:var(--muted);
      font-size:14px;
    }
    code{
      padding:2px 6px;
      border-radius:8px;
      background:rgba(20,48,84,.06);
      color:var(--accent);
    }
    @media (max-width:560px){
      body{padding:12px}
      .shell{padding:14px;border-radius:22px}
      .preview{height:150px}
      .desc{min-height:auto}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">Local Game Hub</div>
      <h1>Choose A Game</h1>
      <p class="sub">One launcher for all local browser prototypes in this folder. Add new entries to the list in the script and they will appear here automatically.</p>
    </section>
    <section id="gameGrid" class="grid" aria-label="Available games"></section>
    <div class="footer">
      Launcher file: <code>game_launcher.html</code>
    </div>
  </main>

  <template id="gameCardTemplate">
    <article class="card">
      <div class="preview"></div>
      <div class="titleRow">
        <div>
          <h2></h2>
        </div>
        <div class="tag"></div>
      </div>
      <p class="desc"></p>
      <div class="actions">
        <button class="launchBtn" type="button">Launch</button>
        <button class="launchBtn secondary" type="button">Open In New Tab</button>
      </div>
    </article>
  </template>

  <script>
    const games = [
      {
        id: "plush",
        title: "Plush Merge Jam",
        file: "plush_merge_jam.html",
        tag: "Merge",
        description: "Arcade merge prototype with a soft toy presentation and quick local launch.",
        preview: "plush"
      },
      {
        id: "snake",
        title: "Snake Merge Defense",
        file: "snake_merge.html",
        tag: "Snake + Defense",
        description: "Hybrid snake, color resource management and lane defense with multiple game modes.",
        preview: "snake"
      },
      {
        id: "worm",
        title: "Worm Link Merge",
        file: "worm_link_merge.html",
        tag: "Worm + Pipes",
        description: "Grid puzzle prototype about slithering worms, mandatory merges, paired sockets, resolve bursts, and quest-driven progression.",
        preview: "worm"
      },
      {
        id: "worm_fortress",
        title: "Wormhold Merge",
        file: "worm_fortress_merge.html",
        tag: "Merge + Auto-Battle",
        description: "Move living fortress-worms on a base grid, merge equal specialists, claim bonus tiles, refresh the pool, and launch short auto-battle waves.",
        preview: "fortress"
      }
    ];

    const grid = document.getElementById("gameGrid");
    const template = document.getElementById("gameCardTemplate");

    function createPreview(previewEl, type) {
      previewEl.classList.add(type);
      if (type === "snake") {
        previewEl.innerHTML = `
          <div class="enemy red" style="left:24px;top:26px"></div>
          <div class="enemy blue" style="left:82px;top:22px"></div>
          <div class="enemy green" style="left:144px;top:34px"></div>
          <div class="wall"></div>
          <div class="line" style="left:18px;top:110px;width:90px"></div>
          <div class="line" style="left:96px;top:110px;width:56px;transform:rotate(-90deg);transform-origin:left center"></div>
          <div class="snakeSeg snakeEnd" style="left:16px;top:104px"></div>
          <div class="snakeSeg green" style="left:54px;top:104px"></div>
          <div class="snakeSeg blue" style="left:92px;top:104px"></div>
          <div class="snakeSeg snakeEnd" style="left:130px;top:104px;transform:scaleX(-1)"></div>
          <div class="orb yellow" style="left:184px;top:114px"></div>
          <div class="orb red" style="left:204px;top:58px"></div>
        `;
        return;
      }
      if (type === "worm") {
        previewEl.innerHTML = `
          <div class="pipeGhost" style="left:30px;top:42px;width:122px;height:18px"></div>
          <div class="pipeGhost" style="left:148px;top:72px;width:18px;height:56px"></div>
          <div class="socket" style="left:24px;top:36px"></div>
          <div class="socket" style="left:146px;top:68px"></div>
          <div class="wormLink" style="left:38px;top:92px;width:86px"></div>
          <div class="wormSeg yellow" style="left:30px;top:88px"></div>
          <div class="wormSeg blue" style="left:70px;top:88px"></div>
          <div class="wormSeg yellow" style="left:110px;top:88px"></div>
          <div class="wormSeg red" style="left:168px;top:44px"></div>
          <div class="wormSeg red" style="left:194px;top:44px"></div>
          <div class="wormSeg green" style="left:176px;top:112px"></div>
          <div class="wormSeg green" style="left:202px;top:112px"></div>
        `;
        return;
      }
      if (type === "fortress") {
        previewEl.innerHTML = `
          <div class="fortressTile" style="left:26px;top:88px"></div>
          <div class="fortressTile" style="left:56px;top:88px"></div>
          <div class="fortressTile" style="left:86px;top:88px"></div>
          <div class="fortressTile" style="left:116px;top:88px"></div>
          <div class="fortressTile" style="left:146px;top:88px"></div>
          <div class="fortressTile" style="left:176px;top:88px"></div>
          <div class="fortressTile" style="left:206px;top:88px"></div>
          <div class="fortressSegment" style="left:42px;top:98px;width:86px"></div>
          <div class="fortressSegment" style="left:138px;top:122px;width:54px;background:linear-gradient(180deg,#fff0bf,#f0c15c)"></div>
          <div class="fortressBadge" style="left:74px;top:98px">⚔️</div>
          <div class="fortressBadge" style="left:154px;top:122px">🎯</div>
          <div class="fortressUnit enemy" style="left:34px;top:28px"></div>
          <div class="fortressUnit enemy" style="left:102px;top:40px"></div>
          <div class="fortressUnit enemy" style="left:198px;top:34px"></div>
          <div class="fortressUnit player" style="left:78px;top:76px"></div>
          <div class="fortressUnit player" style="left:166px;top:104px"></div>
          <div class="fortressBolt" style="left:158px;top:88px"></div>
        `;
        return;
      }
      previewEl.innerHTML = `
        <div class="plushDot" style="left:32px;top:34px"></div>
        <div class="plushDot" style="left:88px;top:78px"></div>
        <div class="plushDot" style="left:156px;top:46px"></div>
        <div class="plushDot" style="left:208px;top:92px"></div>
      `;
    }

    function openGame(file, newTab = false) {
      const url = new URL(file, window.location.href).href;
      if (newTab) {
        window.open(url, "_blank", "noopener");
        return;
      }
      window.location.href = url;
    }

    games.forEach((game) => {
      const fragment = template.content.cloneNode(true);
      const card = fragment.querySelector(".card");
      const preview = fragment.querySelector(".preview");
      const title = fragment.querySelector("h2");
      const tag = fragment.querySelector(".tag");
      const desc = fragment.querySelector(".desc");
      const [launchBtn, newTabBtn] = fragment.querySelectorAll(".launchBtn");

      card.dataset.game = game.id;
      title.textContent = game.title;
      tag.textContent = game.tag;
      desc.textContent = game.description;
      createPreview(preview, game.preview);

      launchBtn.addEventListener("click", () => openGame(game.file, false));
      newTabBtn.addEventListener("click", () => openGame(game.file, true));

      grid.appendChild(fragment);
    });
  </script>
</body>
</html>
