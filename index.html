<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <meta http-equiv="refresh" content="0; url=./game_launcher.html">
  <style>
    html,body{
      margin:0;
      min-height:100%;
      font-family:"Trebuchet MS",Verdana,sans-serif;
      color:#143054;
    }
    body{
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at top left, rgba(90,135,255,.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(245,201,77,.18), transparent 28%),
        linear-gradient(180deg,#eef4ff,#f7f0e7);
    }
    .panel{
      width:min(100%,560px);
      padding:28px;
      border-radius:28px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(20,48,84,.08);
      box-shadow:0 24px 60px rgba(20,48,84,.16);
      text-align:center;
    }
    h1{
      margin:0 0 10px;
      font-size:40px;
      line-height:1;
    }
    p{
      margin:0 0 18px;
      color:#5f7391;
      line-height:1.5;
    }
    a{
      display:inline-block;
      padding:14px 18px;
      border-radius:16px;
      background:#173b67;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 14px 28px rgba(23,59,103,.2);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Game Hub</h1>
    <p>Redirecting to the launcher. If it does not open automatically, use the button below.</p>
    <a href="./game_launcher.html">Open Launcher</a>
  </main>
  <script>
    window.location.replace("./game_launcher.html");
  </script>
</body>
</html>
