<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Plush Merge Jam</title>
  <style>
    :root {
      color-scheme: light;
      --bg-1: #f6e5c8;
      --bg-2: #f0c989;
      --bg-3: #a56639;
      --wood-1: #a96c42;
      --wood-2: #7d4b2d;
      --ink: #4a2c1d;
      --cream: #fff9ef;
      --gold: #ffc75e;
      --shadow: rgba(58, 25, 10, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 245, 216, 0.8), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(255, 221, 160, 0.65), transparent 28%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, #e9b975 100%);
      font-family: "Trebuchet MS", "Segoe Print", "Comic Sans MS", cursive;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

        CELL_SIZE_MAX: 102,
        BLOCK_RADIUS: 22,
        BUTTON_RADIUS: 24,

        SHAKE_DAMPING: 7,

        LONG_PRESS_TIME: 0.42,
        LEVEL_PRESETS: {

            targetCount: [1, 1],
            keyMerges: [8, 8],
            moveSlack: 8,
            maxBlockSize: 3,
            bigBlockCount: [0, 0],
            distractorCount: [0, 0]
          },
          hard: {
            sizes: [[6, 6]],
            density: [0.48, 0.52],
            targetTier: [9, 9],
            targetCount: [1, 1],
            keyMerges: [8, 8],
            moveSlack: 6,

        SIZE_SHAPES: [

          { name: "Sunny Dot", baseColor: "#ffd84d", accentColor: "#fff5a8", face: "dot", points: 30, w: 1, h: 1, spawnable: true },
          { name: "Leaf Dot", baseColor: "#58d65d", accentColor: "#d6ffd8", face: "smile", points: 60, w: 1, h: 1, spawnable: true },
          { name: "Ocean Dot", baseColor: "#35a7ff", accentColor: "#caefff", face: "bear", points: 100, w: 1, h: 1, spawnable: true },
          { name: "Sunny Stick", baseColor: "#ffd84d", accentColor: "#fff5a8", face: "calm", points: 160, w: 1, h: 2, spawnable: true },
          { name: "Leaf Stick", baseColor: "#58d65d", accentColor: "#d6ffd8", face: "fox", points: 240, w: 1, h: 2, spawnable: true },
          { name: "Ocean Stick", baseColor: "#35a7ff", accentColor: "#caefff", face: "sleepy", points: 360, w: 1, h: 2, spawnable: true },
          { name: "Sunny Plush", baseColor: "#ffd84d", accentColor: "#fff5a8", face: "fluff", points: 520, w: 2, h: 2, spawnable: true },
          { name: "Leaf Plush", baseColor: "#58d65d", accentColor: "#d6ffd8", face: "fluff", points: 760, w: 2, h: 2, spawnable: true },
          { name: "Ocean Crown", baseColor: "#35a7ff", accentColor: "#caefff", face: "rare", points: 1200, w: 2, h: 2, spawnable: false }
        ],
        CHAIN_BLUEPRINT: [1, 1, 2, 3, 4, 5, 6, 7, 8],
        UI_THEME: {
          bgTop: "#fff3d1",
          bgMid: "#ffd166",
          bgBottom: "#ff8c42",
          woodA: "#9b5b31",
          woodB: "#6a3418",
          panelTop: "rgba(255, 252, 244, 0.96)",
          panelBottom: "rgba(255, 221, 173, 0.95)",
          panelStroke: "#7a3418",
          text: "#5a240f",
          textSoft: "#8f4a22",
          primaryA: "#ffe14d",
          primaryB: "#ff7b00",
          primaryStroke: "#7c2d12",
          secondaryA: "#71d7ff",
          secondaryB: "#3f5efb",
          secondaryStroke: "#20338b",
          dangerA: "#ff7b8f",
          dangerB: "#ff3864",
          dangerStroke: "#7e1430"
        },
        GOAL_TYPES: {
          TARGET_TIER: "target_tier",
          ENDLESS: "endless"
        },
        STATES: {
          BOOT: "BOOT",
          MENU: "MENU",
          LEVEL_SELECT: "LEVEL_SELECT",
          GAMEPLAY: "GAMEPLAY",
          PAUSE: "PAUSE",
          RESULT_SCREEN: "RESULT_SCREEN"
        }
      };

      class RNG {
        constructor(seed) {
          this.state = RNG.hashSeed(seed);
        }
        static hashSeed(seed) {
          const text = String(seed ?? "seed");
          let h = 2166136261 >>> 0;
          for (let i = 0; i < text.length; i++) {
            h ^= text.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0 || 0x12345678;
        }
        next() {
          let x = this.state >>> 0;
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          this.state = x >>> 0;
          return (this.state >>> 0) / 4294967296;
        }
        range(min, max) { return min + (max - min) * this.next(); }
        int(min, max) { return Math.floor(this.range(min, max + 1)); }
        pick(list) { return list[this.int(0, list.length - 1)]; }
        chance(prob) { return this.next() < prob; }
        weighted(items, getWeight) {
          let total = 0;
          for (const item of items) total += getWeight(item);
          let roll = this.range(0, total);
          for (const item of items) {
            roll -= getWeight(item);
            if (roll <= 0) return item;
          }
          return items[items.length - 1];
        }
        shuffle(list) {
          for (let i = list.length - 1; i > 0; i--) {
            const j = this.int(0, i);
            [list[i], list[j]] = [list[j], list[i]];
          }
          return list;
        }
      }

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function roundRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }
      function withAlpha(hex, alpha) {
        const clean = hex.replace("#", "");
        const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
        const n = parseInt(full, 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
      function getTierDef(tier) { return CONFIG.TIERS[tier]; }
      function getTierSize(tier) {
        const def = getTierDef(tier);
        return { w: def.w, h: def.h };
      }

      class Cell {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.occupant = null;
        }
      }

      class Block {
        constructor(data) {
          this.id = data.id;
          this.x = data.x;
          this.y = data.y;
          this.w = data.w;
          this.h = data.h;
          this.tier = data.tier;
          this.skinType = data.skinType || CONFIG.TIERS[data.tier].face;
          this.visualType = data.visualType || this.skinType;
          this.faceSeed = data.faceSeed || Math.random();
          this.previewX = data.x;
          this.previewY = data.y;
          this.renderOffsetX = 0;
          this.renderOffsetY = 0;
          this.scale = 1;
          this.squash = 0;
          this.mergePulse = 0;
          this.hintPulse = 0;
          this.dragging = false;
          this.highlight = 0;
        }
        cloneState() {
          return {
            id: this.id,
            x: this.x,
            y: this.y,
            w: this.w,
            h: this.h,
            tier: this.tier,
            skinType: this.skinType,
            visualType: this.visualType,
            faceSeed: this.faceSeed
          };
        }
      }

      class ParticleSystem {
        constructor(maxParticles) {
          this.pool = [];
          for (let i = 0; i < maxParticles; i++) this.pool.push({ active: false });
        }
        emit(type, x, y, count, colorA, colorB) {
          for (let i = 0; i < count; i++) {
            const p = this.pool.find((entry) => !entry.active);
            if (!p) return;
            p.active = true;
            p.type = type;
            p.x = x;
            p.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = type === "confetti" ? 120 + Math.random() * 180 : 30 + Math.random() * 180;
            p.vx = Math.cos(angle) * speed;
            p.vy = Math.sin(angle) * speed - (type === "confetti" ? 40 : 0);
            p.life = 0;
            p.maxLife = type === "dust" ? 0.55 : type === "spark" ? 0.7 : 1.2;
            p.size = type === "dust" ? 5 + Math.random() * 12 : 4 + Math.random() * 10;
            p.spin = (Math.random() - 0.5) * 10;
            p.rot = Math.random() * Math.PI * 2;
            p.gravity = type === "dust" ? -8 : 180;
            p.color = Math.random() < 0.5 ? colorA : colorB;
          }
        }
        update(dt) {
          for (const p of this.pool) {
            if (!p.active) continue;
            p.life += dt;
            if (p.life >= p.maxLife) {
              p.active = false;
              continue;
            }
            p.vy += p.gravity * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.spin * dt;
          }
        }
        draw(ctx) {
          for (const p of this.pool) {
            if (!p.active) continue;
            const t = p.life / p.maxLife;
            const alpha = 1 - t;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = alpha;
            if (p.type === "dust") {
              ctx.fillStyle = withAlpha(p.color, alpha * 0.45);
              ctx.beginPath();
              ctx.arc(0, 0, p.size * (0.8 + t), 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = withAlpha(p.color, alpha);
              ctx.beginPath();
              for (let i = 0; i < 5; i++) {
                const outer = p.size;
                const inner = p.size * 0.45;
                const a0 = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                const a1 = a0 + Math.PI / 5;
                if (i === 0) ctx.moveTo(Math.cos(a0) * outer, Math.sin(a0) * outer);
                else ctx.lineTo(Math.cos(a0) * outer, Math.sin(a0) * outer);
                ctx.lineTo(Math.cos(a1) * inner, Math.sin(a1) * inner);
              }
              ctx.closePath();
              ctx.fill();
            }
            ctx.restore();
          }
        }
      }

      class AnimationManager {
        constructor() {
          this.time = 0;
          this.scoreDisplay = 0;
          this.shakeAmount = 0;
          this.shakeDuration = 0;
          this.flash = 0;
        }
        update(dt, board) {
          this.time += dt;
          this.scoreDisplay = lerp(this.scoreDisplay, board ? board.score : 0, clamp(dt * CONFIG.SCORE_POP_LERP, 0, 1));
          if (this.shakeDuration > 0) this.shakeDuration = Math.max(0, this.shakeDuration - dt);
          else this.shakeAmount = lerp(this.shakeAmount, 0, clamp(dt * CONFIG.SHAKE_DAMPING, 0, 1));
          if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 2.2);
        }
        kickShake(amount, duration = 0.35) {
          this.shakeAmount = Math.max(this.shakeAmount, amount);
          this.shakeDuration = Math.max(this.shakeDuration, duration);
        }
        kickFlash(amount) { this.flash = Math.max(this.flash, amount); }
        getShakeOffset() {
          if (this.shakeAmount <= 0.01) return { x: 0, y: 0 };
          const t = performance.now() * 0.001 * CONFIG.SHAKE_FREQ;
          return { x: Math.sin(t) * this.shakeAmount, y: Math.cos(t * 1.3) * this.shakeAmount };
        }
      }

      class SaveManager {
        constructor() { this.data = this.load(); }
        load() {
          try {
            const raw = localStorage.getItem(CONFIG.SAVE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              return {
                unlockedLevel: parsed.unlockedLevel || 1,
                levelStats: parsed.levelStats || {},
                settings: { sfx: parsed.settings?.sfx ?? CONFIG.DEFAULT_SFX }
              };
            }
          } catch (error) {
            console.warn("Save load failed", error);
          }
          return { unlockedLevel: 1, levelStats: {}, settings: { sfx: CONFIG.DEFAULT_SFX } };
        }
        persist() {
          try {
            localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(this.data));
          } catch (error) {
            console.warn("Save persist failed", error);
          }
        }
        isUnlocked(levelIndex) { return levelIndex <= this.data.unlockedLevel; }
        getLevelStats(levelIndex) {
          return this.data.levelStats[levelIndex] || { stars: 0, bestScore: 0, bestMoves: null };
        }
        saveLevelResult(levelIndex, stats) {
          const prev = this.getLevelStats(levelIndex);
          this.data.levelStats[levelIndex] = {
            stars: Math.max(prev.stars || 0, stats.stars || 0),
            bestScore: Math.max(prev.bestScore || 0, stats.score || 0),
            bestMoves: prev.bestMoves == null ? stats.moves : Math.min(prev.bestMoves, stats.moves)
          };
          this.data.unlockedLevel = Math.max(this.data.unlockedLevel, levelIndex + 1);
          this.persist();
        }
        setSfx(enabled) {
          this.data.settings.sfx = enabled;
          this.persist();
        }
      }

      class AudioManager {
        constructor(save) {
          this.save = save;
          this.ctx = null;
          this.enabled = save.data.settings.sfx;
        }
        ensureContext() {
          if (!this.enabled) return null;
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (this.ctx.state === "suspended") this.ctx.resume();
          return this.ctx;
        }
        setEnabled(enabled) {
          this.enabled = enabled;
          this.save.setSfx(enabled);
        }
        beep({ freq = 440, type = "sine", duration = 0.12, attack = 0.01, release = 0.08, volume = 0.08, slideTo = null, delay = 0 }) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const start = ctx.currentTime + delay;
          const end = start + duration;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          if (slideTo != null) osc.frequency.linearRampToValueAtTime(slideTo, end);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(volume, start + attack);
          gain.gain.exponentialRampToValueAtTime(0.0001, end + release);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(end + release + 0.02);
        }
        playUI() { this.beep({ freq: 520, type: "triangle", duration: 0.08, volume: 0.04, slideTo: 620 }); }
        playSlide() { this.beep({ freq: 180, type: "triangle", duration: 0.09, volume: 0.035, slideTo: 130 }); }
        playBlocked() { this.beep({ freq: 150, type: "square", duration: 0.07, volume: 0.03, slideTo: 120 }); }
        playMerge(tier, chain) {
          const base = 240 + tier * 34;
          this.beep({ freq: base, type: "triangle", duration: 0.12, volume: 0.06, slideTo: base + 70 });
          this.beep({ freq: base * 1.5, type: "sine", duration: 0.16, volume: 0.03, delay: 0.02, slideTo: base * 1.6 });
          if (chain > 1) this.beep({ freq: base + 160, type: "triangle", duration: 0.1, volume: 0.045, delay: 0.07, slideTo: base + 210 });
        }
        playHint() { this.beep({ freq: 680, type: "sine", duration: 0.12, volume: 0.04, slideTo: 840 }); }
        playWin() {
          [523, 659, 784, 988].forEach((note, i) => this.beep({ freq: note, type: "triangle", duration: 0.18, volume: 0.05, delay: i * 0.09, slideTo: note * 1.03 }));
        }
        playLose() {
          [480, 360, 260].forEach((note, i) => this.beep({ freq: note, type: "sawtooth", duration: 0.14, volume: 0.035, delay: i * 0.08, slideTo: note * 0.82 }));
        }
      }

      class LevelSolver {
        constructor() {
          this.maxTier = CONFIG.TIERS.length - 1;
        }
        solveLevel(level, maxDepth = CONFIG.MAX_SOLVER_DEPTH) {
          if (level.goal.type === CONFIG.GOAL_TYPES.ENDLESS) return [];
          const initial = {
            width: level.width,
            height: level.height,
            goal: deepClone(level.goal),
            blocks: level.blocks.map((block) => ({ ...block }))
          };
          let frontier = [{ state: initial, path: [], score: this.heuristic(initial) }];
          const visited = new Map();
          visited.set(this.serializeState(initial), 0);
          for (let depth = 0; depth < maxDepth; depth++) {
            const nextFrontier = [];
            for (const node of frontier) {
              const orderedMoves = this.generateMoves(node.state);
              for (const move of orderedMoves) {
                const applied = this.applyMove(node.state, move);
                if (!applied) continue;
                const hash = this.serializeState(applied.state);
                const prevDepth = visited.get(hash);
                if (prevDepth != null && prevDepth <= depth + 1) continue;
                visited.set(hash, depth + 1);
                const nextPath = node.path.concat(move);
                if (this.goalReached(applied.state)) return nextPath;
                const score = this.heuristic(applied.state) + applied.mergeCount * 180 - applied.movedDistance * 2;
                nextFrontier.push({ state: applied.state, path: nextPath, score });
              }
            }
            if (!nextFrontier.length) break;
            nextFrontier.sort((a, b) => b.score - a.score);
            frontier = nextFrontier.slice(0, CONFIG.SOLVER_BEAM_WIDTH);
          }
          return null;
        }
        validateLevel(level) {
          const maxDepth = level.moveLimit ? Math.min(level.moveLimit, CONFIG.MAX_SOLVER_DEPTH + 4) : CONFIG.MAX_SOLVER_DEPTH;
          return !!this.solveLevel(level, maxDepth);
        }
        goalReached(state) {
          if (state.goal.type === CONFIG.GOAL_TYPES.ENDLESS) return false;
          return state.blocks.length === 1;
        }
        serializeState(state) {
          return state.blocks
            .slice()
            .sort((a, b) => (a.tier - b.tier) || (a.w - b.w) || (a.h - b.h) || (a.x - b.x) || (a.y - b.y))
            .map((b) => `${b.x},${b.y},${b.w},${b.h},${b.tier}`)
            .join("|");
        }
        heuristic(state) {
          let bestTier = 0;
          let pairScore = 0;
          for (let i = 0; i < state.blocks.length; i++) {
            const a = state.blocks[i];
            bestTier = Math.max(bestTier, a.tier);
            for (let j = i + 1; j < state.blocks.length; j++) {
              const b = state.blocks[j];
              if (a.tier !== b.tier || a.w !== b.w || a.h !== b.h) continue;
              const dx = Math.abs(a.x - b.x);
              const dy = Math.abs(a.y - b.y);
              pairScore += Math.max(0, 8 - dx - dy);
            }
          }
          const mergePotential = this.estimateMergePotential(state);
          return bestTier * 180 + pairScore - state.blocks.length * 10 - mergePotential * 220;
        }
        estimateMergePotential(state) {
          let count = 0;
          for (let i = 0; i < state.blocks.length; i++) {
            for (let j = i + 1; j < state.blocks.length; j++) {
              const a = state.blocks[i];
              const b = state.blocks[j];
              if (a.tier === b.tier && a.w === b.w && a.h === b.h) count++;
            }
          }
          return count;
        }
        buildGrid(state, excludeIndex = -1) {
          const grid = Array.from({ length: state.height }, () => Array(state.width).fill(-1));
          for (let i = 0; i < state.blocks.length; i++) {
            if (i === excludeIndex) continue;
            const block = state.blocks[i];
            for (let y = 0; y < block.h; y++) {
              for (let x = 0; x < block.w; x++) grid[block.y + y][block.x + x] = i;
            }
          }
          return grid;
        }
        slideRange(state, index, axis) {
          const block = state.blocks[index];
          const grid = this.buildGrid(state, index);
          let neg = 0;
          let pos = 0;
          if (axis === "x") {
            for (let step = 1; ; step++) {
              const nx = block.x - step;
              if (nx < 0) break;
              let free = true;
              for (let yy = 0; yy < block.h && free; yy++) if (grid[block.y + yy][nx] !== -1) free = false;
              if (!free) break;
              neg = step;
            }
            for (let step = 1; ; step++) {
              const checkX = block.x + block.w - 1 + step;
              if (checkX >= state.width) break;
              let free = true;

        }

        }

              moveLimit,

            { tier: 1, x: 0, y: 4 }, { tier: 2, x: 2, y: 4 }, { tier: 3, x: 2, y: 5 }, { tier: 1, x: 1, y: 5 }

            block.mergePulse = Math.max(0, block.mergePulse - dt);
            block.hintPulse = Math.max(0, block.hintPulse - dt);
            block.highlight = Math.max(0, block.highlight - dt * 2);
            block.scale = lerp(block.scale, 1, clamp(dt * 10, 0, 1));
            block.squash = lerp(block.squash, 0, clamp(dt * 10, 0, 1));
            if (!block.dragging) {
              block.renderOffsetX = lerp(block.renderOffsetX, 0, clamp(dt * CONFIG.SNAP_LERP, 0, 1));
              block.renderOffsetY = lerp(block.renderOffsetY, 0, clamp(dt * CONFIG.SNAP_LERP, 0, 1));
            }
          }
        }
        countGoalProgress() {
          if (!this.goal || this.goal.type === CONFIG.GOAL_TYPES.ENDLESS) return 0;
          return this.blocks.filter((block) => block.tier >= this.goal.targetTier).length;
        }
        isWin() {
          if (!this.goal) return false;
          if (this.goal.type === CONFIG.GOAL_TYPES.ENDLESS) return false;
          return this.blocks.length === 1;
        }
        isLose() {
          return false;
        }
        getHintMove() {
          if (this.goal.type === CONFIG.GOAL_TYPES.ENDLESS) return this.findDirectMergeMove();
          const level = {
            width: this.width,
            height: this.height,
            blocks: this.blocks.map((block) => block.cloneState()),
            goal: this.goal,
            moveLimit: this.movesLimit ? Math.max(1, this.movesLimit - this.movesMade) : CONFIG.MAX_SOLVER_DEPTH
          };
          const path = this.game.generator.solveLevel(level, Math.min(8, level.moveLimit || 8));
          return path && path.length ? path[0] : this.findDirectMergeMove();
        }
        findDirectMergeMove() {
          const level = { width: this.width, height: this.height, blocks: this.blocks.map((b) => b.cloneState()) };
          const solver = this.game.generator.solver;
          const state = { ...level, goal: { type: CONFIG.GOAL_TYPES.TARGET_TIER, targetTier: this.goal?.targetTier || 2, count: 1 } };
          const moves = solver.generateMoves(state);
          for (const move of moves) {
            const result = solver.applyMove(state, move);
            if (result && result.mergeCount > 0) return move;
          }
          return moves[0] || null;
        }
        triggerHint() {
          const move = this.getHintMove();
          if (!move) return false;
          const block = this.blocks[move.index];
          if (!block) return false;
          block.hintPulse = CONFIG.HINT_TIME;
          block.highlight = CONFIG.HINT_TIME;
          this.selectedBlockId = block.id;
          this.hintTimer = CONFIG.HINT_TIME;
          this.hintInfo = move;
          this.game.audio.playHint();
          return true;
        }
        getAvailableMergePairs() {
          if (!this.mergePairsDirty) return this.mergePairsCache;
          const pairs = [];
          let moveCount = 0;
          const solver = this.game.generator.solver;
          const state = {
            width: this.width,
            height: this.height,
            blocks: this.blocks.map((block) => block.cloneState()),
            goal: { type: CONFIG.GOAL_TYPES.TARGET_TIER, targetTier: this.goal?.targetTier || 2, count: 1 }
          };
          const moves = solver.generateMoves(state);
          for (const move of moves) {
            const result = solver.applyMove(state, move);
            if (result && result.mergeCount > 0) {
              pairs.push(move.index);
              moveCount++;
            }
          }
          this.mergePairsCache = new Set(pairs);
          this.mergeMoveCountCache = moveCount;
          this.mergePairsDirty = false;
          return this.mergePairsCache;
        }
        getRemainingMergeMoveCount() {
          this.getAvailableMergePairs();
          return this.mergeMoveCountCache;
        }
        hasRemainingMerges() {
          return this.getRemainingMergeMoveCount() > 0;
        }
        calculateStars() {
          if (this.mode !== "campaign") return 0;
          if (!this.isWin()) return 0;
          const base = this.movesLimit ? this.movesLimit : Math.max(1, this.stats.moves);
          const ratio = this.stats.moves / base;
          if (ratio <= 0.55) return 3;
          if (ratio <= 0.8) return 2;
          return 1;
        }
      }

          }

      class InputManager {
        constructor(game) {
          this.game = game;
          this.pointer = null;
          this.longPress = null;
          this.bind();
        }
        bind() {
          const canvas = this.game.canvas;
          canvas.addEventListener("pointerdown", (event) => this.onPointerDown(event));
          canvas.addEventListener("pointermove", (event) => this.onPointerMove(event));
          canvas.addEventListener("pointerup", (event) => this.onPointerUp(event));
          canvas.addEventListener("pointercancel", (event) => this.onPointerUp(event));
          window.addEventListener("keydown", (event) => this.onKeyDown(event));
        }
        toCanvasPosition(event) {
          const rect = this.game.canvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) * (this.game.viewWidth / rect.width),
            y: (event.clientY - rect.top) * (this.game.viewHeight / rect.height)
          };
        }
        cancelLongPress() {
          if (this.longPress) {
            clearTimeout(this.longPress);
            this.longPress = null;
          }
        }
        onPointerDown(event) {
          const pos = this.toCanvasPosition(event);
          this.game.audio.ensureContext();
          const button = this.game.ui.hitButton(pos.x, pos.y);
          if (button && !button.disabled) {
            this.pointer = { type: "button", button };
            return;
          }
          if (this.game.state === CONFIG.STATES.LEVEL_SELECT) {
            const card = this.game.ui.hitLevelCard(pos.x, pos.y);
            if (card && card.unlocked) {
              this.pointer = { type: "level_card", card };
              return;
            }
          }
          if (this.game.state !== CONFIG.STATES.GAMEPLAY) return;
          const cell = this.game.screenToBoard(pos.x, pos.y);
          if (!cell) return;
          const block = this.game.board.getBlockAtCell(cell.x, cell.y);
          if (!block) return;
          this.game.board.selectedBlockId = block.id;
          block.dragging = true;
          this.pointer = {
            type: "drag",
            blockId: block.id,
            startX: pos.x,
            startY: pos.y,
            lastX: pos.x,
            lastY: pos.y,
            axis: null,
            range: null,
            moveCells: 0
          };
          this.longPress = setTimeout(() => {
            if (this.pointer && this.pointer.type === "drag" && this.pointer.blockId === block.id) this.game.showHint();
          }, CONFIG.LONG_PRESS_TIME * 1000);
        }
        onPointerMove(event) {
          if (!this.pointer || this.pointer.type !== "drag") return;
          const pos = this.toCanvasPosition(event);
          const block = this.game.board.getBlockById(this.pointer.blockId);
          if (!block) return;
          this.pointer.lastX = pos.x;
          this.pointer.lastY = pos.y;
          const dx = pos.x - this.pointer.startX;
          const dy = pos.y - this.pointer.startY;
          if (!this.pointer.axis) {
            if (Math.abs(dx) < CONFIG.DRAG_THRESHOLD && Math.abs(dy) < CONFIG.DRAG_THRESHOLD) return;
            this.pointer.axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
            this.pointer.range = this.game.board.getSlideRange(block, this.pointer.axis);
            this.cancelLongPress();
          }
          const cellSize = this.game.layout.cellSize;
          let cells = this.pointer.axis === "x" ? Math.round(dx / cellSize) : Math.round(dy / cellSize);
          cells = clamp(cells, -this.pointer.range.neg, this.pointer.range.pos);
          this.pointer.moveCells = cells;
          if (this.pointer.axis === "x") {
            block.renderOffsetX = cells * cellSize;
            block.renderOffsetY = 0;
          } else {
            block.renderOffsetX = 0;
            block.renderOffsetY = cells * cellSize;
          }
          block.squash = clamp(Math.abs(cells) * 0.08, 0, 0.22);
          if (Math.abs(cells) > 0 && Math.random() < CONFIG.SLIDE_DUST_RATE) {
            const center = this.game.boardToScreen(block.x + block.w / 2, block.y + block.h / 2);
            this.game.particles.emit("dust", center.x, center.y, 2, "#d9b387", "#fff0d5");
          }
        }
        onPointerUp(event) {
          if (!this.pointer) return;
          const pos = this.toCanvasPosition(event);
          const pointer = this.pointer;
          this.pointer = null;
          this.cancelLongPress();
          if (pointer.type === "button") {
            const hit = this.game.ui.hitButton(pos.x, pos.y);
            if (hit && hit.id === pointer.button.id && !hit.disabled) {
              this.game.audio.playUI();
              hit.onClick();
            }
            return;
          }
          if (pointer.type === "level_card") {
            const card = this.game.ui.hitLevelCard(pos.x, pos.y);
            if (card && card.index === pointer.card.index && card.unlocked) {
              this.game.audio.playUI();
              this.game.startCampaignLevel(card.index);
            }
            return;
          }
          if (pointer.type === "drag") {
            const block = this.game.board.getBlockById(pointer.blockId);
            if (!block) return;
            block.dragging = false;
            const moveCells = pointer.moveCells || 0;
            if (!pointer.axis || moveCells === 0) {
              block.renderOffsetX = 0;
              block.renderOffsetY = 0;
              block.squash = 0;
              return;
            }
            const dx = pointer.axis === "x" ? moveCells : 0;
            const dy = pointer.axis === "y" ? moveCells : 0;
            const result = this.game.board.moveBlock(block, dx, dy);
            if (!result.moved) this.game.audio.playBlocked();
          }
        }
        onKeyDown(event) {
          const state = this.game.state;
          if (state !== CONFIG.STATES.GAMEPLAY && state !== CONFIG.STATES.PAUSE) return;
          if (event.key === "Escape") {
            event.preventDefault();
            if (state === CONFIG.STATES.GAMEPLAY) this.game.pauseGame();
            else this.game.resumeGame();
            return;
          }
          if (state !== CONFIG.STATES.GAMEPLAY) return;
          const key = event.key.toLowerCase();
          if (key === "z") {
            event.preventDefault();
            this.game.undo();
          } else if (key === "r") {
            event.preventDefault();
            this.game.restartLevel();
          } else if (key === "h") {
            event.preventDefault();
            this.game.showHint();
          }
        }
      }

      class Game {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext("2d");
          this.viewWidth = 0;
          this.viewHeight = 0;
          this.layout = null;
          this.state = CONFIG.STATES.BOOT;
          this.save = new SaveManager();
          this.audio = new AudioManager(this.save);
          this.animations = new AnimationManager();
          this.particles = new ParticleSystem(CONFIG.MAX_PARTICLES);
          this.generator = new LevelGenerator(new LevelSolver());
          this.board = new Board(this);
          this.ui = new UIManager(this);
          this.input = new InputManager(this);
          this.campaignLevels = [];
          this.currentLevelIndex = null;
          this.resultSnapshot = null;
          this.lastTimestamp = 0;
          this.accumulator = 0;
          window.addEventListener("resize", () => this.resize());
          this.resize();
          this.boot();
        }
        boot() {
          this.campaignLevels = this.generator.createCampaignLevels();
          this.setState(CONFIG.STATES.MENU);
          requestAnimationFrame((ts) => this.frame(ts));
        }
        resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const width = window.innerWidth;
          const height = window.innerHeight;
          this.canvas.width = Math.round(width * dpr);
          this.canvas.height = Math.round(height * dpr);
          this.canvas.style.width = `${width}px`;
          this.canvas.style.height = `${height}px`;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          this.viewWidth = width;
          this.viewHeight = height;
          this.layout = this.computeLayout();
        }
        computeLayout() {
          const width = this.viewWidth;
          const height = this.viewHeight;
          const boardW = this.board.width || 6;
          const boardH = this.board.height || 6;
          const reserveRight = this.state === CONFIG.STATES.GAMEPLAY || this.state === CONFIG.STATES.PAUSE ? (width > 920 ? 320 : 0) : 0;
          const usableWidth = width - reserveRight - CONFIG.SIDE_GUTTER * 2;
          const usableHeight = height - CONFIG.HUD_TOP - CONFIG.HUD_BOTTOM - 38;
          const cellSize = clamp(Math.floor(Math.min(usableWidth / boardW, usableHeight / boardH)), CONFIG.CELL_SIZE_MIN, CONFIG.CELL_SIZE_MAX);
          const boardPxW = boardW * cellSize;
          const boardPxH = boardH * cellSize;
          const boardX = width > 920 ? 24 : (width - boardPxW) * 0.5;
          const boardY = CONFIG.HUD_TOP + 18 + Math.max(0, (usableHeight - boardPxH) * 0.5);
          return { width, height, cellSize, boardX, boardY, boardW, boardH, boardPxW, boardPxH };
        }
        setState(nextState) {
          this.state = nextState;
          this.layout = this.computeLayout();
        }
        startCampaignLevel(levelIndex) {
          const level = deepClone(this.campaignLevels[levelIndex - 1]);
          if (!level) return;
          this.currentLevelIndex = levelIndex;
          this.board.loadLevel(level);
          this.resultSnapshot = null;
          this.setState(CONFIG.STATES.GAMEPLAY);
        }
        openRandomLevel(difficulty) {
          const seed = `random_${difficulty}_${Date.now()}`;
          const level = this.generator.generateLevel({ difficulty, mode: "random" }, seed);
          this.currentLevelIndex = null;
          this.board.loadLevel(level);
          this.resultSnapshot = null;
          this.setState(CONFIG.STATES.GAMEPLAY);
        }
        startEndless() {
          const seed = `endless_${Date.now()}`;
          const level = this.generator.generateLevel({ difficulty: "normal", mode: "endless", targetTier: 5 }, seed);
          level.goal = { type: CONFIG.GOAL_TYPES.ENDLESS };
          level.moveLimit = null;
          level.name = "Endless Meadow";
          this.currentLevelIndex = null;
          this.board.loadLevel(level);
          this.resultSnapshot = null;
          this.setState(CONFIG.STATES.GAMEPLAY);
        }
        nextCampaignLevel() {
          if (this.currentLevelIndex == null) {
            this.setState(CONFIG.STATES.MENU);
            return;
          }
          const next = Math.min(CONFIG.CAMPAIGN_LEVELS, this.currentLevelIndex + 1);
          this.startCampaignLevel(next);
        }
        restartLevel() {
          if (this.state !== CONFIG.STATES.GAMEPLAY) return;
          this.audio.playUI();
          this.board.restart();
        }
        restartFromResult() {
          if (this.currentLevelIndex != null) this.startCampaignLevel(this.currentLevelIndex);
          else if (this.board.mode === "random") this.openRandomLevel(this.board.levelMeta.difficulty);
          else if (this.board.mode === "endless") this.startEndless();
        }
        pauseGame() {
          if (this.state !== CONFIG.STATES.GAMEPLAY) return;
          this.audio.playUI();
          this.setState(CONFIG.STATES.PAUSE);
        }
        resumeGame() {
          if (this.state !== CONFIG.STATES.PAUSE) return;
          this.audio.playUI();
          this.setState(CONFIG.STATES.GAMEPLAY);
        }
        toggleAudio() {
          this.audio.setEnabled(!this.audio.enabled);
          this.audio.playUI();
        }
        undo() {
          if (this.state !== CONFIG.STATES.GAMEPLAY) return;
          if (this.board.undo()) this.audio.playUI();
          else this.audio.playBlocked();
        }
        showHint() {
          if (this.state !== CONFIG.STATES.GAMEPLAY) return;
          if (!this.board.triggerHint()) this.audio.playBlocked();
        }
        boardToScreen(cellX, cellY) {
          const layout = this.layout;
          return { x: layout.boardX + cellX * layout.cellSize, y: layout.boardY + cellY * layout.cellSize };
        }
        screenToBoard(x, y) {
          const layout = this.layout;
          const cx = Math.floor((x - layout.boardX) / layout.cellSize);
          const cy = Math.floor((y - layout.boardY) / layout.cellSize);
          if (cx < 0 || cy < 0 || cx >= this.board.width || cy >= this.board.height) return null;
          return { x: cx, y: cy };
        }
        frame(timestamp) {
          const delta = Math.min(0.1, (timestamp - this.lastTimestamp) / 1000 || CONFIG.FIXED_DT);
          this.lastTimestamp = timestamp;
          this.accumulator += delta;
          let steps = 0;
          while (this.accumulator >= CONFIG.FIXED_DT && steps < CONFIG.MAX_STEPS_PER_FRAME) {
            this.update(CONFIG.FIXED_DT);
            this.accumulator -= CONFIG.FIXED_DT;
            steps++;
          }
          this.draw();
          requestAnimationFrame((ts) => this.frame(ts));
        }
        update(dt) {
          if (this.state === CONFIG.STATES.GAMEPLAY) {
            this.board.update(dt);
            if (this.board.isWin()) this.finishLevel(true);
          }
          this.particles.update(dt);
          this.animations.update(dt, this.board);
          this.layout = this.computeLayout();
        }
        finishLevel(won) {
          if (this.state !== CONFIG.STATES.GAMEPLAY) return;
          if (won) {
            const stars = this.board.calculateStars();
            if (this.currentLevelIndex != null) {
              this.save.saveLevelResult(this.currentLevelIndex, { stars, score: this.board.score, moves: this.board.stats.moves });
            }
            this.audio.playWin();
            const center = this.boardToScreen(this.board.width / 2, this.board.height / 2);
            this.particles.emit("confetti", center.x, center.y, 48, "#ffcf66", "#fff5c0");
          }
          this.resultSnapshot = { won, score: this.board.score, stars: this.board.calculateStars() };
          this.setState(CONFIG.STATES.RESULT_SCREEN);
        }
        drawBackground(ctx, layout) {
          const grad = ctx.createLinearGradient(0, 0, 0, layout.height);
          grad.addColorStop(0, CONFIG.UI_THEME.bgTop);
          grad.addColorStop(0.52, CONFIG.UI_THEME.bgMid);
          grad.addColorStop(1, CONFIG.UI_THEME.bgBottom);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, layout.width, layout.height);
          ctx.save();
          for (let i = 0; i < 18; i++) {
            const x = (i * 127) % (layout.width + 120) - 60;
            const y = ((i * 89) % (layout.height + 140)) - 70;
            ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.12)" : "rgba(255,212,77,0.10)";
            ctx.beginPath();
            ctx.arc(x, y, 28 + (i % 5) * 8, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
          if (this.state === CONFIG.STATES.MENU || this.state === CONFIG.STATES.LEVEL_SELECT) {
            const animals = [
              { x: layout.width * 0.18, y: layout.height * 0.76, tier: 3, scale: 1.1 },
              { x: layout.width * 0.78, y: layout.height * 0.74, tier: 5, scale: 1.35 },
              { x: layout.width * 0.86, y: layout.height * 0.22, tier: 8, scale: 0.82 }
            ];
            animals.forEach((animal, index) => this.drawMascot(ctx, animal.x, animal.y, animal.tier, animal.scale, index));
          }
        }
        drawMascot(ctx, x, y, tier, scale, index) {
          const info = CONFIG.TIERS[tier];
          const bob = Math.sin(this.animations.time * 1.4 + index * 0.9) * 10;
          const size = 84 * scale;
          ctx.save();
          ctx.translate(x, y + bob);
          ctx.shadowColor = "rgba(71, 34, 17, 0.18)";
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 10;
          const grad = ctx.createLinearGradient(-size, -size, size, size);
          grad.addColorStop(0, info.accentColor);
          grad.addColorStop(1, info.baseColor);
          roundRectPath(ctx, -size * 0.82, -size * 0.68, size * 1.64, size * 1.36, size * 0.38);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.lineWidth = 7;
          ctx.strokeStyle = "#6d4024";
          ctx.stroke();
          this.drawFace(ctx, tier, size * 0.85, size * 0.65, 0.4);
          ctx.restore();
        }
        drawBoard(ctx, layout) {
          if (!this.board.width || !this.board.height) return;
          const shake = this.animations.getShakeOffset();
          const x = layout.boardX + shake.x;
          const y = layout.boardY + shake.y;
          const w = layout.boardPxW;
          const h = layout.boardPxH;
          ctx.save();
          ctx.shadowColor = "rgba(74, 31, 11, 0.24)";
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 14;
          const woodGrad = ctx.createLinearGradient(x, y, x + w, y + h);
          woodGrad.addColorStop(0, "#c8732f");
          woodGrad.addColorStop(0.5, CONFIG.UI_THEME.woodA);
          woodGrad.addColorStop(1, CONFIG.UI_THEME.woodB);
          roundRectPath(ctx, x - 18, y - 18, w + 36, h + 36, 36);
          ctx.fillStyle = woodGrad;
          ctx.fill();
          const trayGrad = ctx.createLinearGradient(x, y, x, y + h);
          trayGrad.addColorStop(0, "#fff4cf");
          trayGrad.addColorStop(1, "#ffcb78");
          roundRectPath(ctx, x, y, w, h, 28);
          ctx.fillStyle = trayGrad;
          ctx.fill();
          ctx.lineWidth = 6;
          ctx.strokeStyle = CONFIG.UI_THEME.panelStroke;
          ctx.stroke();
          for (let gy = 0; gy < this.board.height; gy++) {
            for (let gx = 0; gx < this.board.width; gx++) {
              const cellX = x + gx * layout.cellSize;
              const cellY = y + gy * layout.cellSize;
              ctx.fillStyle = (gx + gy) % 2 === 0 ? "rgba(255, 253, 244, 0.30)" : "rgba(255, 178, 61, 0.10)";
              roundRectPath(ctx, cellX + 3, cellY + 3, layout.cellSize - 6, layout.cellSize - 6, 10);
              ctx.fill();
            }
          }
          ctx.restore();
          const hintBlocks = this.board.getAvailableMergePairs();
          const sortedBlocks = this.board.blocks.slice().sort((a, b) => (a.dragging === b.dragging ? 0 : a.dragging ? 1 : -1));
          for (const block of sortedBlocks) this.drawBlock(ctx, block, layout, hintBlocks.has(this.board.blocks.indexOf(block)));
        }
        drawBlock(ctx, block, layout, hasHintPair) {
          const tier = CONFIG.TIERS[block.tier];
          const breath = 1 + Math.sin(this.animations.time * CONFIG.BREATH_SPEED + block.faceSeed * 10) * 0.018;
          const hintPulse = block.hintPulse > 0 ? 1 + Math.sin(this.animations.time * 8) * 0.06 : 1;
          const mergePulse = block.mergePulse > 0 ? 1 + easeOutBack(1 - block.mergePulse / CONFIG.MERGE_FLASH_TIME) * 0.16 : 1;
          const finalScaleX = block.scale * breath * hintPulse * mergePulse * (1 + block.squash * 0.18);
          const finalScaleY = block.scale * breath * hintPulse * mergePulse * (1 - block.squash * 0.14);
          const pos = this.boardToScreen(block.x, block.y);
          const screenX = pos.x + block.renderOffsetX;
          const screenY = pos.y + block.renderOffsetY;
          const pixelW = block.w * layout.cellSize;
          const pixelH = block.h * layout.cellSize;
          const centerX = screenX + pixelW / 2;
          const centerY = screenY + pixelH / 2;
          const selected = this.board.selectedBlockId === block.id;
          const glow = selected || block.highlight > 0 || hasHintPair;
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.scale(finalScaleX, finalScaleY);
          ctx.translate(-pixelW / 2, -pixelH / 2);
          ctx.shadowColor = glow ? withAlpha(tier.baseColor, 0.75) : "rgba(69, 30, 11, 0.18)";
          ctx.shadowBlur = glow ? 24 : 14;
          ctx.shadowOffsetY = block.dragging ? 12 : 8;
          const grad = ctx.createLinearGradient(0, 0, pixelW, pixelH);
          grad.addColorStop(0, tier.accentColor);
          grad.addColorStop(0.55, tier.baseColor);
          grad.addColorStop(1, withAlpha(tier.baseColor, 0.92));
          roundRectPath(ctx, 8, 8, pixelW - 16, pixelH - 16, Math.min(CONFIG.BLOCK_RADIUS, pixelW * 0.22, pixelH * 0.22));
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.save();
          ctx.clip();
          const sheen = ctx.createLinearGradient(0, 0, pixelW, 0);
          sheen.addColorStop(0, "rgba(255,255,255,0.3)");
          sheen.addColorStop(0.6, "rgba(255,255,255,0.02)");
          ctx.fillStyle = sheen;
          roundRectPath(ctx, 18, 18, pixelW - 36, pixelH * 0.38, Math.min(18, pixelH * 0.12));
          ctx.fill();
          ctx.restore();
          ctx.lineWidth = 6;
          ctx.strokeStyle = "#6d4024";
          ctx.stroke();
          ctx.fillStyle = "rgba(83, 42, 20, 0.12)";
          roundRectPath(ctx, 20, pixelH - 30, pixelW - 40, 10, 6);
          ctx.fill();
          this.drawFace(ctx, block.tier, pixelW, pixelH, block.faceSeed);
          if (glow) {
            ctx.strokeStyle = withAlpha("#fff9e8", 0.9);
            ctx.lineWidth = 3;
            roundRectPath(ctx, 12, 12, pixelW - 24, pixelH - 24, Math.min(18, pixelH * 0.18));
            ctx.stroke();
          }
          ctx.restore();
        }
        drawFace(ctx, tier, width, height, seedFactor) {
          const info = CONFIG.TIERS[tier];
          const eyeY = height * 0.46;
          const eyeDX = Math.max(10, width * 0.16);
          const eyeR = Math.max(3, Math.min(width, height) * 0.045);
          const mouthY = height * 0.58;
          const centerX = width * 0.5;
          ctx.save();
          ctx.fillStyle = "#452717";
          ctx.beginPath();
          ctx.arc(centerX - eyeDX, eyeY, eyeR, 0, Math.PI * 2);
          ctx.arc(centerX + eyeDX, eyeY, eyeR, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.beginPath();
          ctx.arc(centerX - eyeDX - eyeR * 0.25, eyeY - eyeR * 0.25, eyeR * 0.35, 0, Math.PI * 2);
          ctx.arc(centerX + eyeDX - eyeR * 0.25, eyeY - eyeR * 0.25, eyeR * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#452717";
          ctx.lineWidth = Math.max(2, Math.min(width, height) * 0.018);
          if (info.face === "bear" || info.face === "sleepy") {
            ctx.beginPath();
            ctx.arc(width * 0.24, height * 0.23, Math.min(width, height) * 0.11, 0, Math.PI * 2);
            ctx.arc(width * 0.76, height * 0.23, Math.min(width, height) * 0.11, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (info.face === "fox") {
            ctx.beginPath();
            ctx.moveTo(width * 0.21, height * 0.23);
            ctx.lineTo(width * 0.28, height * 0.08);
            ctx.lineTo(width * 0.34, height * 0.24);
            ctx.moveTo(width * 0.79, height * 0.23);
            ctx.lineTo(width * 0.72, height * 0.08);
            ctx.lineTo(width * 0.66, height * 0.24);
            ctx.stroke();
          }
          if (info.face === "rare") {
            ctx.beginPath();
            ctx.arc(width * 0.5, height * 0.2, Math.min(width, height) * 0.12, Math.PI * 0.95, Math.PI * 0.05, true);
            ctx.stroke();
          }
          if (info.face === "sleepy") {
            ctx.beginPath();
            ctx.moveTo(centerX - eyeDX - 8, eyeY + 1);
            ctx.lineTo(centerX - eyeDX + 8, eyeY - 3);
            ctx.moveTo(centerX + eyeDX - 8, eyeY - 3);
            ctx.lineTo(centerX + eyeDX + 8, eyeY + 1);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(centerX - 10, mouthY);
          ctx.quadraticCurveTo(centerX, mouthY + 10 + seedFactor * 3, centerX + 10, mouthY);
          ctx.stroke();
          ctx.restore();
        }
        drawStateSpecific(ctx, layout) {
          if (this.state === CONFIG.STATES.GAMEPLAY || this.state === CONFIG.STATES.PAUSE) this.drawBoard(ctx, layout);
        }
        drawOverlay(ctx, layout) {
          if (this.animations.flash > 0) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 250, 230, ${this.animations.flash * 0.22})`;
            ctx.fillRect(0, 0, layout.width, layout.height);
            ctx.restore();
          }
        }
        draw() {
          const ctx = this.ctx;
          const layout = this.layout;
          ctx.clearRect(0, 0, layout.width, layout.height);
          this.drawBackground(ctx, layout);
          this.drawStateSpecific(ctx, layout);
          this.particles.draw(ctx);
          this.ui.draw(ctx, layout);
          this.drawOverlay(ctx, layout);
        }
      }

      const game = new Game(document.getElementById("gameCanvas"));
      window.__PLUSH_MERGE_JAM__ = game;
    })();
  </script>
</body>
</html>
